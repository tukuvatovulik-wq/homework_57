{% extends "webapp/base.html" %}
{% block title %}Список задач{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Список задач</h1>
    <a class="btn btn-primary" href="{% url 'task_create' %}">Добавить задачу</a>
</div>
{% for task in tasks %}
    {% include "webapp/includes/task_card.html" with task=task %}
{% empty %}
    <div class="alert alert-info">Пока задач нет.</div>
{% endfor %}
{% endblock %}
